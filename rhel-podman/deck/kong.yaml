# Kong gateway config — THE SOURCE OF TRUTH for 192.168.1.103 (Rocky Linux + Podman).
#
# Apply with:   ./kong-config.sh diff     (preview)
#               ./kong-config.sh apply    (backup live state, then sync)
#
# decK makes Kong match this file EXACTLY: anything in Kong that is not in this
# file (services, routes, plugins, consumers, ...) is DELETED on apply.
# Don't make changes with curl against the Admin API any more; put them here.
#
# Only non-default fields are listed. Kong fills in the rest (read_timeout 60000,
# retries 5, protocols [http, https], ...). How-to: ../deck-yaml-config-rhel.md
_format_version: "3.0"

services:

# --- crapi-app: crapi.cropseyit.com -> 192.168.1.101:8888
- name: crapi-app
  protocol: http
  host: 192.168.1.101
  port: 8888
  connect_timeout: 60000
  routes:
  - name: crapi-root
    hosts: [crapi.cropseyit.com]
    paths: [/]
    strip_path: false
    preserve_host: true
  plugins:
  - name: rate-limiting
    config:
      minute: 1000
      hour: 20000
      policy: local
      limit_by: ip
      fault_tolerant: true
      hide_client_headers: false

